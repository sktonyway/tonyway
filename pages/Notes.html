<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    #input-container {
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #input-container:focus-within .note-title {
      display: block;
      border: none;
    }

    #input-container:focus-within .input-text {
      border: none;
    }

    input:focus {
      outline: none;
      height: fit-content;
    }

    input {
      min-width: 400px;
      background-color: transparent;
    }

    /* This is card component inside notes */
    .card,
    .input-text {
      padding: 8px;
      border: 1.5px solid var(--font-color);
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: small;
    }

    /* Here is the code for input option */



    .note-title {
      display: none;
      font-weight: bold;
      font-size: large;
      padding: 8px;
    }

    #notes-grid {
      column-count: 5;
      column-gap: 8px;
    }

    .card {
      color: var(--font-color2);
      width: 225px;
      overflow-wrap: break-word;
      break-inside: avoid;
      margin-bottom: 8px;
      user-select: none;
    }

    .card .card-title {
      font-weight: 400;
      font-size: 1rem;
      font-style: italic;
      color: var(--font-color);
    }

    .wrapper {
      display: flex;
      justify-content: center;
      width: 100vw;
      padding: 18px;
    }

    dialog {
      border: none;
      border-radius: 8px;
      width: 100vw !important;
      height: 100vh !important;
      text-align: center;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page {
      width: 90vw;
      flex: 1;
      padding: 30px;
    }

    input,
    textarea {
      border: none;
      width: 100%;
      padding: 20px;
      height: fit-content;
      border: 1px solid white;
    }

    input:focus {
      outline: none;
      border-left: 1px solid black;
    }

    textarea:focus {
      outline: none;
    }

    input {
      font-size: 2.5rem;
      font-family: serif;

    }

    textarea {
      font-size: 1.5rem;
      overflow-y: auto;
    }

    @media (max-width: 600px) {
      #notes-grid {
        column-count: 2;
      }
    }
  </style>
</head>

<body>
  <nav>
    <ul>
      <li><a href="../index.html" class="nav-links">Home</a></li>
      <li><a href="#" class="nav-links">Notes</a></li>
      <li><a href="./Todo.html" class="nav-links">To-Do</a></li>
      <li><a href="#" class="nav-links">Urgent</a></li>
      <li><a href="#" class="nav-links">Finances</a></li>
    </ul>
  </nav>
  <div id="input-container">
    <input type="text" class="note-title" placeholder="Title" />
    <input type="text" class="input-text" placeholder="Start writing here..." />
  </div>
  <div class="wrapper">
    <div id="notes-grid">
      <!-- <div class="card">
            <div class="card-title">This is a test title</div>
            this is a wrk
        </div> -->
    </div>
  </div>
  <dialog id="noteDialog">
    <a href="#" id="closeDialog">Close</a>
    <div class="page">
      <input type="text" name="title" id="title" placeholder="Title">
      <br>
      <textarea name="text" id="text" placeholder="Start Writing Here" rows="30"></textarea>
    </div>
  </dialog>
</body>
<script src="../index.js"></script>
<script>
  fetchAndDisplayNotes();
  document.addEventListener("click", async (e) => {

    const card = e.target.closest(".card");
    if (!card) return;

    const id = card.dataset.id;

    const res = await fetch(`https://tonyway-backend.vercel.app/${id}`);
    const note = await res.json();

    document.querySelector("#title").value = note.title;
    document.querySelector("#text").value = note.content;

    document.querySelector("#noteDialog").showModal();
  });

  document.querySelector("#closeDialog").addEventListener("click", (e) => {
    e.preventDefault()
    document.querySelector("#noteDialog").close();
  });
</script>

</html>
