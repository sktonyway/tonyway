<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    #input-container {
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #input-container:focus-within .note-title {
      display: block;
      border: none;
    }

    #input-container:focus-within .input-text {
      border: none;
    }

    input:focus {
      outline: none;
      height: fit-content;
    }

    input {
      min-width: 400px;
      background-color: transparent;
    }

    /* This is card component inside notes */
    .card,
    .input-text {
      padding: 8px;
      border: 1.5px solid var(--font-color);
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: smaller;
    }

    /* Here is the code for input option */



    .note-title {
      display: none;
      font-weight: bold;
      font-size: large;
      padding: 8px;
    }

    #notes-grid {

      max-width: 95%;
    }

    .card {
      display: inline-block;
      height: fit-content;
      max-width: 250px;
      /* word-wrap: break-word; */
      overflow-wrap: break-word;
      break-inside: avoid;
    }

    .wrapper {
      display: flex;
      justify-content: center;
    }

    @media (max-width: 600px) {
      #note-grid {

        grid-template-columns: repeat(2, 1fr);
      }

      .card {
        max-width: 45%;
      }
    }
  </style>
</head>

<body>
  <nav>
    <ul>
      <li><a href="../index.html" class="nav-links">Home</a></li>
      <li><a href="#" class="nav-links">Notes</a></li>
      <li><a href="./Todo.html" class="nav-links">To-Do</a></li>
      <li><a href="#" class="nav-links">Urgent</a></li>
      <li><a href="#" class="nav-links">Finances</a></li>
    </ul>
  </nav>
  <div id="input-container">
    <input type="text" class="note-title" placeholder="Title" />
    <input type="text" class="input-text" placeholder="Start writing here..." />
  </div>
  <div class="wrapper">
    <div id="notes-grid">
      <!-- <div class="card">
            <div class="card-title">This is a test title</div>
            this is a wrk
        </div> -->
    </div>
  </div>
</body>
<script src="../index.js"></script>
<script>
  fetchAndDisplayNotes();
</script>

</html>
