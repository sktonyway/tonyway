<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: var(--hover-b-color);
        }

        form {
            padding: 10px;
            border-radius: 10px;
        }
        input{
            width: 200px;
            height: 40px;
            border: 2px solid var(--font-color);
            margin-bottom: 10px;
            font-family: var(--font);
            font-size: larger;
            padding: 10px;
        }
        p{
            text-align: center;
            font-family: monospace;
            font-size: smaller;
        }
    </style>
</head>

<body>
    <form action="">
        <input type="email" class="login" id="username">
        <br>
        <input type="password" name="password" id="password">
        <p>Just Log In</p>
    </form>
</body>

<script>
  if (localStorage.getItem("authStatus") === "verified") {
      window.location.replace("/index.html");
  }

  function login() {
      localStorage.setItem("authStatus", "verified");
      window.location.replace("/index.html");
  }
</script>
<script>
    let userInput = document.getElementById('username')
    let pass = document.getElementById('password')

    pass.addEventListener('input', () => {
        if (pass.value.length === 6) {
            let cred = {
                username: userInput.value,
                password: pass.value,
            }
            handleLogin(cred);
            console.log(cred)
        }
    })

    const handleLogin = async (credentials) => {
        try {
            const response = await fetch('https://tonyway-backend.vercel.app/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(credentials)
            });

            const data = await response.json();

            if (response.ok) {
                // Save to localStorage
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('passWd', data.pass);
                localStorage.setItem('authStatus', "verified")

                // Redirect to notes page
                window.location.href = '../index.html';
            } else {
                alert(data.message);
            }
        } catch (error) {
            console.error("Login failed:", error);
        }
    };
</script>

</html>
